<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#f5f7fa 0%,#e4ecf5 100%); }
  .card { background:#fff; border-radius:16px; padding:48px 40px; max-width:420px; width:90%;
          text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.08); }
  .tick-wrap { width:96px; height:96px; margin:0 auto 24px; }
  .circle { stroke-dasharray:302; stroke-dashoffset:302; animation:draw-circle .7s ease-out forwards; }
  .tick { stroke-dasharray:80; stroke-dashoffset:80; animation:draw-tick .5s .6s ease-out forwards; }
  @keyframes draw-circle { to { stroke-dashoffset:0; } }
  @keyframes draw-tick { to { stroke-dashoffset:0; } }
  h1 { font-size:24px; color:#1f2d3d; margin-bottom:10px; font-weight:600; }
  p { font-size:15px; color:#64748b; line-height:1.6; }
  .btn { display:inline-block; margin-top:28px; padding:12px 32px; border-radius:8px;
         background:#2563eb; color:#fff; text-decoration:none; font-size:15px; font-weight:500; }
  .btn:hover { background:#1d4ed8; }
</style>
</head>
<body>
  <div class="card">
    <svg class="tick-wrap" viewBox="0 0 110 110">
      <circle class="circle" cx="55" cy="55" r="48" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
      <path class="tick" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
            d="M32 57 L48 72 L78 40"/>
    </svg>
    <h1>Booking Confirmed</h1>
    <p>Your appointment has been scheduled successfully.<br>A confirmation email with the meeting details is on its way to you.</p>
    <a class="btn" href="https://teams.live.com/meet/9330266239315?p=OgcYEn2HEmbwxSwr3a">Join Meeting</a>
  </div>
</body>
</html>
